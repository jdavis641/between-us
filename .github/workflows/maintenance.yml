name: Scheduled Mechanism Audit

on:
  schedule:
    - cron: '0 0 1 * *' # Run at 00:00 on the 1st of every month
  workflow_dispatch: # Allow manual triggering

jobs:
  audit-and-cycle:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Mechanism Audit
      run: node scripts/mechanism-audit.js > audit-report.txt
      
    - name: Feed Output to Autonomous Cycle
      run: |
        cat audit-report.txt
        # Pass the report into the autonomous cycle for the QA agent to evaluate and trigger upgrades if necessary
        bash scripts/autonomous-cycle.sh --audit-file audit-report.txt
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
