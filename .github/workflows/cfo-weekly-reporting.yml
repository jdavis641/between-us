name: CFO Weekly Financial & Subscriber Reporting

on:
  schedule:
    # Run every Friday at 5:00 PM UTC (17:00)
    - cron: '0 17 * * 5'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  cfo-financial-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Execute CFO Reporting Engine
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cfo-engine.js

      - name: Commit and Push Weekly Summary
        run: |
          git config --global user.name "CFO Agent"
          git config --global user.email "cfo-agent@between-us.app"
          git add docs/financial-reports/weekly-summary.md
          git commit -m "Auto-update: Weekly CFO Report" || echo "No changes to commit"
          git push

